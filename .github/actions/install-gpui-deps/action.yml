name: Install gpui system dependencies
description: Install Linux system packages required to build gpui-based crates
runs:
  using: composite
  steps:
    - name: Install gpui system dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y gcc g++ clang libfontconfig-dev libwayland-dev \
          libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
          libssl-dev libzstd-dev vulkan-validationlayers libvulkan1
