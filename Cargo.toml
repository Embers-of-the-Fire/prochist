[workspace]
resolver = "2"
members = [
    "crates/prochist-core",
    "bin/prochist-cli",
    "bin/prochist-tui",
    "bin/prochist-gui",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/y4nettechi/prochist"

[workspace.dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
gpui-kit = "0.8.0"
prochist-core = { version = "0.3.0", path = "crates/prochist-core" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trycmd = "1.2"
snapbox = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RestartManager",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[profile.release]
lto = true

# Keep gpui debug builds interactive (recommended by gpui-kit); proc macros
# stay unoptimized on purpose.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
