[workspace]
resolver = "2"
members = ["crates/prochist-core", "bin/prochist-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/y4nettechi/prochist"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trycmd = "1.2"
snapbox = "1.2"

[profile.release]
lto = true
